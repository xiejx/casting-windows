<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: http: https:; media-src 'self' http: https: blob:; connect-src 'self' http: https:; worker-src 'self' blob:;">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>投屏接收器</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 8V6a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3h-6"/>
            <path d="M3 13a8 8 0 0 1 8 8"/>
            <path d="M3 17a4 4 0 0 1 4 4"/>
            <circle cx="3.5" cy="20.5" r=".6" fill="currentColor"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>投屏接收器</h1>
          <span>接收安卓 App 内置投屏 · DLNA</span>
        </div>
      </div>
      <div class="top-right">
        <div class="status-chip" id="statusChip">
          <span class="dot"></span>
          <span id="statusText">正在启动…</span>
        </div>
        <button class="ghost-btn" id="settingsBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 8a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/>
          </svg>
          设置
        </button>
      </div>
    </header>

    <main class="layout">
      <section class="card player-card" id="playerCard">
        <div class="video-stage mode-idle" id="stage">
          <div class="stage-glow"></div>
          <video id="video" playsinline></video>
          <img id="imageView" class="image-view" hidden alt="">
          <div class="audio-view" id="audioView" hidden>
            <img id="audioCover" alt="">
            <div class="audio-placeholder" id="audioPlaceholder">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
                <path d="M9 18V6l10-2v12"/>
                <circle cx="6" cy="18" r="3"/>
                <circle cx="16" cy="16" r="3"/>
              </svg>
            </div>
          </div>

          <div class="idle" id="idleView">
            <div class="cast-orb">
              <span class="pulse p1"></span>
              <span class="pulse p2"></span>
              <div class="orb-core">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3 8V6a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3h-6"/>
                  <path d="M3 13a8 8 0 0 1 8 8"/>
                  <path d="M3 17a4 4 0 0 1 4 4"/>
                  <circle cx="3.5" cy="20.5" r=".6" fill="currentColor"/>
                </svg>
              </div>
            </div>
            <h2>等待手机投屏</h2>
            <p class="idle-desc">在安卓 App 里点击「投屏 / TV」按钮，选择下面这个设备</p>
            <div class="device-pill">
              <span class="wifi-ring"></span>
              <span id="idleDeviceName">正在获取设备名…</span>
            </div>
            <p class="idle-hint">手机与电脑需要连接同一个 Wi-Fi</p>
          </div>

          <div class="stage-top">
            <span class="state-badge" id="stateBadge">待机</span>
            <span class="media-type" id="mediaType"></span>
          </div>
        </div>

        <div class="now-head">
          <div class="now-title" id="nowTitle">暂无播放</div>
          <div class="now-sub" id="nowSub">等待接收投屏内容</div>
        </div>

        <div class="transport">
          <div class="buttons">
            <button class="icon-btn primary" id="playPauseBtn" disabled title="播放 / 暂停">
              <svg class="ic-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.87l10.2-6.5a1 1 0 0 0 0-1.74L9.5 4.63A1 1 0 0 0 8 5.5Z"/></svg>
              <svg class="ic-pause" viewBox="0 0 24 24" fill="currentColor" hidden><rect x="6.5" y="5" width="3.6" height="14" rx="1.2"/><rect x="13.9" y="5" width="3.6" height="14" rx="1.2"/></svg>
            </button>
            <button class="icon-btn" id="stopBtn" disabled title="停止">
              <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
            </button>
          </div>
          <span class="time" id="currentTime">0:00</span>
          <input class="range seek" id="seekBar" type="range" min="0" max="1000" step="1" value="0" disabled>
          <span class="time" id="totalTime">0:00</span>
          <div class="volume">
            <button class="icon-btn small" id="muteBtn" title="静音">
              <svg class="ic-vol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 5 6.5 8.6H3v6.8h3.5L11 19V5Z"/>
                <path d="M15.2 9.2a4 4 0 0 1 0 5.6"/>
                <path d="M18 6.5a8 8 0 0 1 0 11"/>
              </svg>
              <svg class="ic-mute" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" hidden>
                <path d="M11 5 6.5 8.6H3v6.8h3.5L11 19V5Z"/>
                <path d="m16 9 5 5m0-5-5 5"/>
              </svg>
            </button>
            <input class="range vol" id="volumeBar" type="range" min="0" max="100" step="1" value="60">
          </div>
          <div class="quality">
            <button class="icon-btn small" id="qualityBtn" title="清晰度" hidden>
              <span class="quality-label" id="qualityLabel">自动</span>
            </button>
            <div class="quality-menu" id="qualityMenu" hidden></div>
          </div>
          <div class="speed">
            <button class="icon-btn small" id="speedBtn" title="播放速度">
              <span class="speed-label" id="speedLabel">1×</span>
            </button>
            <div class="speed-menu" id="speedMenu" hidden>
              <button data-rate="0.5">0.5×</button>
              <button data-rate="0.75">0.75×</button>
              <button data-rate="1" class="active">1×</button>
              <button data-rate="1.25">1.25×</button>
              <button data-rate="1.5">1.5×</button>
              <button data-rate="2">2×</button>
            </div>
          </div>
          <button class="icon-btn small" id="fullscreenBtn" title="全屏">
            <svg class="ic-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 9V4h5"/>
              <path d="M20 9V4h-5"/>
              <path d="M4 15v5h5"/>
              <path d="M20 15v5h-5"/>
            </svg>
            <svg class="ic-shrink" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" hidden>
              <path d="M9 4v5H4"/>
              <path d="M15 4v5h5"/>
              <path d="M9 20v-5H4"/>
              <path d="M15 20v-5h5"/>
            </svg>
          </button>
        </div>
      </section>

      <aside class="side">
        <div class="card info-card">
          <h3>本机设备</h3>
          <div class="kv"><span>设备名</span><strong id="infoName">—</strong></div>
          <div class="kv"><span>投屏地址</span><strong id="infoAddr">—</strong></div>
          <div class="kv"><span>服务状态</span><strong id="infoState">—</strong></div>
          <button class="wide-btn" id="firewallBtn">放行 Windows 防火墙</button>
        </div>

        <div class="card log-card">
          <div class="log-head">
            <h3>运行日志</h3>
            <button id="clearLogBtn">清空</button>
          </div>
          <div class="log-list" id="logList"></div>
        </div>
      </aside>
    </main>
  </div>

  <div class="modal" id="settingsModal" hidden>
    <div class="modal-mask" id="modalMask"></div>
    <div class="modal-card">
      <h2>接收器设置</h2>
      <label class="field">
        <span>设备名称</span>
        <input id="nameInput" maxlength="60" autocomplete="off">
      </label>
      <label class="field">
        <span>HTTP 端口</span>
        <input id="portInput" type="number" min="1024" max="65535" step="1">
      </label>
      <label class="field">
        <span>网络接口</span>
        <select id="interfaceSelect"></select>
      </label>
      <p class="modal-tip">保存后投屏服务会自动重启，手机端可能需要重新搜索设备。</p>
      <div class="cache-box">
        <div class="cache-row">
          <span class="cache-title">缓存目录 <span class="cache-badge" id="cacheMode" hidden>便携模式</span></span>
          <button class="ghost-btn mini" id="openCacheBtn">打开目录</button>
        </div>
        <div class="cache-path" id="cachePath">读取中…</div>
        <div class="cache-row">
          <span class="cache-size" id="cacheSize">当前占用 —</span>
          <button class="ghost-btn mini" id="clearCacheBtn">清除缓存</button>
        </div>
      </div>
      <div class="modal-actions">
        <button class="ghost-btn" id="cancelBtn">取消</button>
        <button class="primary-btn" id="saveBtn">保存并重启</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="../../node_modules/hls.js/dist/hls.min.js"></script>
  <script src="../../node_modules/mpegts.js/dist/mpegts.js"></script>
  <script src="app.js"></script>
</body>
</html>
